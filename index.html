<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuildHaul - Construction Vehicle Marketplace</title>
    <meta name="description" content="The right machine. The right site. The right time. Connects contractors with owners of heavy trucks, tractors, mini trucks, loaders, and tippers." />
    <meta property="og:title" content="BuildHaul - Construction Vehicle Marketplace" />
    <meta property="og:description" content="The right machine. The right site. The right time. Connects contractors with owners of heavy trucks, tractors, mini trucks, loaders, and tippers." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #0a0a0a;
        color: #f5f5f5;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      #root-fallback {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .loader-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(245, 158, 11, 0.15);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: bh-spin 0.8s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes bh-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-amber-500 selection:text-neutral-950 min-h-screen">
    <div id="root">
      <!-- Fallback displayed only while scripts load or if script load encounters an issue -->
      <div id="root-fallback">
        <div class="loader-spinner"></div>
        <div style="font-size: 18px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px;">
          Build<span style="color: #f59e0b;">Haul</span>
        </div>
        <div style="font-size: 13px; color: #a3a3a3;">
          Loading marketplace & vehicle fleets...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
