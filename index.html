<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuildHaul - Construction Vehicle Marketplace</title>
    <meta name="description" content="The right machine. The right site. The right time. Connects contractors with owners of heavy trucks, tractors, mini trucks, loaders, and tippers." />
    <meta property="og:title" content="BuildHaul - Construction Vehicle Marketplace" />
    <meta property="og:description" content="The right machine. The right site. The right time. Connects contractors with owners of heavy trucks, tractors, mini trucks, loaders, and tippers." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #0a0a0a;
        color: #f5f5f5;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      #root-fallback {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .loader-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(245, 158, 11, 0.15);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: bh-spin 0.8s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes bh-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-amber-500 selection:text-neutral-950 min-h-screen">
    <div id="root">
      <!-- Fallback displayed only while scripts load -->
      <div id="root-fallback">
        <div class="loader-spinner"></div>
        <div style="font-size: 18px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px;">
          Build<span style="color: #f59e0b;">Haul</span>
        </div>
        <div style="font-size: 13px; color: #a3a3a3; margin-bottom: 12px;">
          Loading marketplace & vehicle fleets...
        </div>
        <div id="root-loader-subtext" style="font-size: 11px; color: #737373;">
          Initializing fleet telemetry and real-time site dispatch...
        </div>
      </div>
    </div>

    <script>
      // Watchdog to ensure user is never stranded on an infinite spinner
      (function() {
        var timeoutId = setTimeout(function() {
          var fb = document.getElementById('root-fallback');
          if (fb && !window.__BUILDHAUL_MOUNTED__) {
            var subtext = document.getElementById('root-loader-subtext');
            if (subtext) {
              subtext.innerHTML = '<span style="color:#f59e0b;">Loading is taking longer than usual.</span> ' +
                '<br/><a href="#" onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload(); return false;" style="color:#f59e0b; text-decoration:underline; font-weight:bold; margin-top:8px; display:inline-block;">Click here to reset cache and reload</a>';
            }
          }
        }, 3500);

        window.addEventListener('error', function(e) {
          console.error('[BuildHaul Startup Error]:', e);
          var fb = document.getElementById('root-fallback');
          if (fb && !window.__BUILDHAUL_MOUNTED__) {
            fb.innerHTML = [
              '<div style="max-width: 480px; padding: 24px; background: #171717; border: 1px solid #262626; border-radius: 16px; margin: 0 auto;">',
                '<div style="font-size: 28px; margin-bottom: 12px;">⚠️</div>',
                '<div style="font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 8px;">Startup Notification</div>',
                '<div style="font-size: 12px; color: #a3a3a3; margin-bottom: 16px; word-break: break-word;">' + (e.message || 'Error loading application bundle') + '</div>',
                '<button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();" style="padding: 10px 20px; background: #f59e0b; color: #0a0a0a; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer;">Reset Cache & Reload</button>',
              '</div>'
            ].join('');
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
